<section class="Hero">
  <div class="container-fluid">
    <div class="row justify-content-start">
      <div
        class="col-12 col-lg-5 col-md-8 d-flex align-items-center align-content-center align-items-md-start align-content-md-start justify-content-md-start flex-column order-last order-md-first p-5">
        <div class="logo">
          <img src="{{image_base_url}}/layered-logo-white.svg" alt="layered logo" width="600" height="103" />
        </div>
        <h1>
          {{ hero_headline_text }}
        </h1>
        <h3>
          {{ hero_subheadline_text }}
        </h3>
      </div>
    </div>
  </div>

  <!-- Gallery Script -->
  <script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function () {
      // Get all slides
      const slides = document.querySelectorAll('.gallery-slide');
      let currentSlide = 0;

      // Auto slide change every 4 seconds
      setInterval(() => {
        let nextSlide = (currentSlide + 1) % slides.length;

        // Remove active class from all slides
        slides.forEach(slide => slide.classList.remove('active'));

        // Add active class to next slide
        slides[nextSlide].classList.add('active');

        // Update current slide index
        currentSlide = nextSlide;
      }, 2500);
    });
  </script>
</section>
